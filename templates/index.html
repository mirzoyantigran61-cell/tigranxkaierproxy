<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#070b14"
    >

    <meta
        name="color-scheme"
        content="dark light"
    >

    <meta
        name="description"
        content="TIGRAN AI — intelligent AI workspace"
    >

    <title>TIGRAN AI</title>

    <!-- ===================================================== -->
    <!-- MAIN STYLES -->
    <!-- ===================================================== -->
    <link
        rel="stylesheet"
        href="/static/css/app.css"
    >

    <!-- ===================================================== -->
    <!-- CODE HIGHLIGHTING -->
    <!-- ===================================================== -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"
    >
</head>

<body>

    <!-- ===================================================== -->
    <!-- NOSCRIPT -->
    <!-- ===================================================== -->
    <noscript>
        <div class="noscript-warning">
            Для работы TIGRAN AI необходимо включить JavaScript.
        </div>
    </noscript>


    <!-- ===================================================== -->
    <!-- APPLICATION ROOT -->
    <!-- ===================================================== -->
    <div id="app">

        <div
            id="initial-loader"
            class="initial-loader"
            aria-live="polite"
        >
            <div class="initial-loader-logo">
                TIGRAN AI
            </div>

            <div class="initial-loader-spinner"></div>

            <div class="initial-loader-text">
                Загрузка...
            </div>
        </div>

    </div>


    <!-- ===================================================== -->
    <!-- GLOBAL TOASTS -->
    <!-- ===================================================== -->
    <div
        id="toast-container"
        class="toast-container"
        aria-live="polite"
        aria-atomic="true"
    ></div>


    <!-- ===================================================== -->
    <!-- GLOBAL MODAL -->
    <!-- ===================================================== -->
    <div
        id="global-modal"
        class="modal-backdrop hidden"
        aria-hidden="true"
    >
        <div
            class="modal"
            role="dialog"
            aria-modal="true"
        >
            <div class="modal-header">

                <h2 id="global-modal-title">
                    TIGRAN AI
                </h2>

                <button
                    id="global-modal-close"
                    class="icon-button"
                    type="button"
                    aria-label="Закрыть"
                >
                    ×
                </button>

            </div>

            <div
                id="global-modal-content"
                class="modal-content"
            ></div>

        </div>
    </div>


    <!-- ===================================================== -->
    <!-- GLOBAL CONFIRM DIALOG -->
    <!-- ===================================================== -->
    <div
        id="confirm-modal"
        class="modal-backdrop hidden"
        aria-hidden="true"
    >
        <div
            class="modal confirm-modal"
            role="dialog"
            aria-modal="true"
        >
            <div class="modal-header">

                <h2 id="confirm-title">
                    Подтверждение
                </h2>

            </div>

            <div class="modal-content">

                <p id="confirm-message">
                    Вы уверены?
                </p>

            </div>

            <div class="modal-actions">

                <button
                    id="confirm-cancel"
                    class="button secondary"
                    type="button"
                >
                    Отмена
                </button>

                <button
                    id="confirm-ok"
                    class="button danger"
                    type="button"
                >
                    Подтвердить
                </button>

            </div>

        </div>
    </div>


    <!-- ===================================================== -->
    <!-- MARKDOWN / SECURITY / CODE -->
    <!-- ===================================================== -->
    <script
        src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        defer
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"
        defer
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"
        defer
    ></script>


    <!-- ===================================================== -->
    <!-- FIREBASE WEB SDK -->
    <!-- ===================================================== -->
    <script
        src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"
        defer
    ></script>

    <script
        src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"
        defer
    ></script>


    <!-- ===================================================== -->
    <!-- TIGRAN AI V4 FRONTEND -->
    <!-- Load order is important -->
    <!-- ===================================================== -->

    <script
        src="/static/js/api.js"
        defer
    ></script>

    <script
        src="/static/js/firebase-init.js"
        defer
    ></script>

    <script
        src="/static/js/i18n.js"
        defer
    ></script>

    <script
        src="/static/js/auth.js"
        defer
    ></script>

    <script
        src="/static/js/webauthn.js"
        defer
    ></script>

    <script
        src="/static/js/chat.js"
        defer
    ></script>

    <script
        src="/static/js/images.js"
        defer
    ></script>

    <script
        src="/static/js/dashboard.js"
        defer
    ></script>

    <script
        src="/static/js/server_controls.js"
        defer
    ></script>

    <script
        src="/static/js/settings.js"
        defer
    ></script>

   <script
    src="/static/js/account.js"
    defer
></script>

<script
    src="/static/js/payments.js"
    defer
></script>

<script
    src="/static/js/admin.js"
    defer
></script>

<script
    src="/static/js/app.js"
    defer
></script>

</body>
</html>
